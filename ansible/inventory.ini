# inventory.ini
#
# The EC2 host IP is intentionally NOT hardcoded here.
# Jenkins passes it at runtime via the -e flag:
#
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
#     -e "ansible_host=<EC2_HOST>"
#
# For local / manual runs, pass the host directly:
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
#     -e "ansible_host=16.171.42.228" \
#     ...
#
# NOTE: ansible_host=PLACEHOLDER is intentional — the real IP is always
# injected at runtime via the -e flag above, which overrides this value.
# Do NOT use Jinja2 {{ }} syntax here; the INI parser does not evaluate it.

[webservers]
ec2_instance ansible_host=PLACEHOLDER ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3
