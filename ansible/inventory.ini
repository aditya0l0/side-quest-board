# inventory.ini
#
# The EC2 host IP is intentionally NOT hardcoded here.
# Jenkins passes it at runtime via the -e flag:
#
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
#     -e "ansible_host=<EC2_HOST>"
#
# For local / manual runs, export the variable first:
#   export EC2_HOST=13.48.57.103
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
#     -e "ansible_host=$EC2_HOST"

[webservers]
ec2_instance ansible_host={{ ec2_host }} ansible_user=ubuntu ansible_python_interpreter=/usr/bin/python3
