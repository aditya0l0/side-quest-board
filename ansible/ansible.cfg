[defaults]
# Inventory file location (can be overridden via -i flag)
inventory         = inventory.ini

# Suppress SSH host key checking for automated CI runs.
# NOTE: In production environments, consider using a known_hosts file instead.
host_key_checking = False

# Use Python 3 explicitly
interpreter_python = auto_silent

# Keep output clean in CI logs
stdout_callback   = yaml
callbacks_enabled = timer

# Retry files create noise in the repository
retry_files_enabled = False

# Suppress the apt_repository → deb822_repository deprecation notice.
# The deploy.yml playbook has been updated to use deb822_repository already;
# this silences any residual warnings from older Ansible collections.
deprecation_warnings = False

[ssh_connection]
# Pipelining reduces the number of SSH connections per task, speeding up playbooks
pipelining = True
# ConnectTimeout=10: fail fast if the EC2 host is unreachable (e.g. Security Group blocks port 22)
# instead of waiting for the OS default ~2 minute TCP timeout.
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
