version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sidequest-db
    environment:
      MYSQL_ROOT_PASSWORD: aditya123123
      MYSQL_DATABASE: sidequest_board
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: sidequest-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sidequest_board?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: aditya123123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sidequest-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # ──────────────────────────────────────────────────────────────────────────
  # GitHub Issues → Jenkins Webhook Receiver
  #
  # Listens for GitHub "issues.labeled" events and triggers the matching
  # Jenkins CI job via the Jenkins REST API.
  #
  # Before starting, copy webhook-server/.env.example → webhook-server/.env
  # and fill in GITHUB_WEBHOOK_SECRET, JENKINS_USER, JENKINS_API_TOKEN.
  # ──────────────────────────────────────────────────────────────────────────
  webhook:
    build: ./webhook-server
    container_name: sidequest-webhook
    restart: unless-stopped
    ports:
      - "3000:3000"            # expose to host so GitHub can reach it (or via ngrok)
    env_file:
      - ./webhook-server/.env  # copy from .env.example — never commit this file
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
