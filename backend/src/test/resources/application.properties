# ═══════════════════════════════════════════════
# Side-Quest Board — Test Configuration (H2)
# ═══════════════════════════════════════════════
# Overrides the main application.properties when running mvn test.
# Mirrors the env-var overrides the Jenkinsfile injects into the test-backend container.

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate — let it create the schema from entity mappings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Jackson — serialize dates as ISO strings (keep in sync with main config)
spring.jackson.serialization.write-dates-as-timestamps=false
