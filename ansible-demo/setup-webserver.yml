---
- name: Setup Basic Nginx Web Server on EC2 Instance
  hosts: webservers
  become: true

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Nginx web server
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is running and enabled on boot
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy custom index.html page
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Ansible Success</title>
              <style>
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding-top: 100px; }
                  .card { background: #1e293b; display: inline-block; padding: 40px 60px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
                  h1 { color: #38bdf8; font-size: 2.2rem; margin-bottom: 10px; }
                  p { color: #94a3b8; font-size: 1.2rem; }
                  .badge { background: #22c55e; color: #052e16; font-weight: bold; padding: 8px 18px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; }
              </style>
          </head>
          <body>
              <div class="card">
                  <span class="badge">ANSIBLE MANAGED</span>
                  <h1>Hello from Ansible on AWS EC2!</h1>
                  <p>This web server was automatically configured using an Ansible Playbook.</p>
              </div>
          </body>
          </html>
        dest: /var/www/html/index.html
